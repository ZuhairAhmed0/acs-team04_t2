services:
  # Backend API Web Service
  - type: web
    name: fuel-wallet-backend
    runtime: go
    rootDir: Backend
    buildCommand: go mod tidy && go build -o server main.go
    startCommand: ./server
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_PATH
        value: logs
      - key: RATE_LIMIT_RPS
        value: "20"
      - key: RATE_LIMIT_BURST
        value: "40"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: REFRESH_TOKEN_EXPIRATION_DAYS
        value: "30"

  # Frontend Static Site
  - type: web
    name: fuel-wallet-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
